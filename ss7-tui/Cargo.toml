[package]
name = "ss7-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ss7-billing = { path = "../ss7-billing" }
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
russh = "0.46"
russh-keys = "0.46"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
